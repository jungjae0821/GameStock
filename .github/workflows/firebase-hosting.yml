name: Deploy frontend to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare production environment
        run: |
          cp .env.example .env.production
          sed -i '/^VITE_API_BASE_URL=/d' .env.production
          echo 'VITE_API_BASE_URL=https://gamestock-api.161-33-33-45.sslip.io' >> .env.production

      - name: Typecheck, test and build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT repository secret is required."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        # 15.34.1부터 배포 전에 Service Usage API 권한을 따로 확인해, 이 서비스 계정으로는 403이 난다.
        run: npx --yes firebase-tools@15.34.0 deploy --only hosting --project gamestock-20994
