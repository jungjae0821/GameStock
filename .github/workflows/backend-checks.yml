name: Check backend

# 배포 워크플로(oci-backend.yml)와 같은 조건으로 테스트만 PR 단계에서 미리 돌린다.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 13367:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test deployment validation and rollback
        run: python3 backend/ops/test-deploy-oci.py

      - name: Test and build backend
        working-directory: backend
        env:
          ADMIN_TEST_JDBC: 'jdbc:mysql://127.0.0.1:13367/?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
          ADMIN_TEST_USER: root
          ADMIN_TEST_PASSWORD: ''
        run: >-
          mvn --batch-mode --no-transfer-progress
          '-Dmarket.test.jdbc=jdbc:mysql://127.0.0.1:13367/?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
          '-Dloan.test.jdbc=jdbc:mysql://127.0.0.1:13367/?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
          -Dloan.test.user=root -Dloan.test.password= -Dmarket.activity=true verify
