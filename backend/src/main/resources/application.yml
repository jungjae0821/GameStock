spring:
  application:
    name: gamestock-backend
  task:
    scheduling:
      # 4개 매칭 그룹과 뉴스·유동성·보호장치 작업을 함께 실행한다.
      pool:
        size: 8
  datasource:
    # Railway에서는 DB_URL을 지정하거나 MYSQLHOST/MYSQLPORT/MYSQLDATABASE를
    # 서비스 변수로 연결한다. 값이 없으면 기존 로컬 MySQL로 접속한다.
    url: "${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:gamestock}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: "${DB_USERNAME:${MYSQLUSER:jungjae0821}}"
    password: "${DB_PASSWORD:${MYSQLPASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        useServerPrepStmts: true
        cachePrepStmts: true
        prepStmtCacheSize: 128
        prepStmtCacheSqlLimit: 65536
server:
  shutdown: graceful
  # Railway가 할당한 포트를 우선 사용하고, 로컬에서는 8081을 사용한다.
  port: ${PORT:8081}
  error:
    include-message: always
market:
  matching:
    enabled: ${GAMESTOCK_MATCHING_ENABLED:true}
  websocket:
    interval-ms: ${GAMESTOCK_WS_INTERVAL_MS:100}
  persistence:
    max-attempts: ${GAMESTOCK_DB_BATCH_ATTEMPTS:4}
  batch:
    enabled: ${GAMESTOCK_BATCH_BOTS_ENABLED:true}
    participants: ${GAMESTOCK_BOT_PARTICIPANTS:6020}
    target-per-symbol: ${GAMESTOCK_TARGET_FILLS_PER_SYMBOL:300}
    book-cache: true
    # Legacy compatibility flag. Bot raw orders are never durably written;
    # only bot_stats/candles and bounded counters are persisted.
    compact-ledger: true
    inline-liquidity: true
    active-cadence-ms: ${GAMESTOCK_ACTIVE_BATCH_MS:100}
    # Existing legacy bot payload rows are cleaned incrementally; new batches
    # never create them. Human orders/trades remain detailed.
    detail-retention-minutes: ${GAMESTOCK_BOT_DETAIL_MINUTES:15}
    adaptive: ${GAMESTOCK_ADAPTIVE_ACTIVITY:true}
    # 30분 주기 갱신 안에서만 사용하는 매칭 속도. 무접속 상시 체결 목표가 아니다.
    idle-target-per-symbol: ${GAMESTOCK_IDLE_FILLS_PER_SYMBOL:30}
    idle-after-ms: ${GAMESTOCK_MARKET_IDLE_AFTER_MS:120000}
    # 무접속 중에는 30분마다 짧은 실제 매칭만 수행한다. 밀린 체결은 소급 생성하지 않는다.
    idle-refresh-ms: ${GAMESTOCK_IDLE_REFRESH_MS:1800000}
    idle-refresh-batches: ${GAMESTOCK_IDLE_REFRESH_BATCHES:5}
gamestock:
  cors-origin: ${GAMESTOCK_CORS_ORIGIN:http://localhost:8080}
  auth:
    # Firebase UID 또는 확인된 이메일이 아래 값과 일치하는 계정만 ADMIN으로 승격한다.
    admin-google-uid: ${GAMESTOCK_ADMIN_GOOGLE_UID:}
    admin-google-email: ${GAMESTOCK_ADMIN_GOOGLE_EMAIL:}
  simulation:
    # 고정 seed는 초기 프로필/환경을 재현한다. 생략하면 실행마다 무작위 seed를 사용한다.
    seed: ${GAMESTOCK_SIMULATION_SEED:}
  hangang:
    enabled: ${GAMESTOCK_HANGANG_ENABLED:true}
    site-url: ${GAMESTOCK_HANGANG_SITE_URL:https://xn--939at9l4tgt7l6ps.com/ko}
    refresh-ms: ${GAMESTOCK_HANGANG_REFRESH_MS:1800000}
    initial-delay-ms: ${GAMESTOCK_HANGANG_INITIAL_DELAY_MS:60000}
  news:
    enabled: ${GAMESTOCK_NEWS_ENABLED:true}
    refresh-ms: ${GAMESTOCK_NEWS_REFRESH_MS:600000}
    initial-delay-ms: ${GAMESTOCK_NEWS_INITIAL_DELAY_MS:30000}
    # stocks/games의 현재 종목명으로 모든 거래 종목의 RSS 검색을 자동 생성한다.
    # 아래 목록은 특정 종목의 검색 URL을 덮어쓰는 설정이다.
    feeds:
      - "UMA|https://news.google.com/rss/search?q=%EC%9A%B0%EB%A7%88%EB%AC%B4%EC%8A%A4%EB%A9%94%20%ED%94%84%EB%A6%AC%ED%8B%B0%EB%8D%94%EB%B9%84&hl=ko&gl=KR&ceid=KR:ko"
      - "BA|https://news.google.com/rss/search?q=%EB%B8%94%EB%A3%A8%20%EC%95%84%EC%B9%B4%EC%9D%B4%EB%B8%8C&hl=ko&gl=KR&ceid=KR:ko"
      - "GOV|https://news.google.com/rss/search?q=%EC%8A%B9%EB%A6%AC%EC%9D%98%20%EC%97%AC%EC%8B%A0%20%EB%8B%88%EC%BC%80&hl=ko&gl=KR&ceid=KR:ko"
      - "ZZZ|https://news.google.com/rss/search?q=%EC%A0%A0%EB%A0%88%EC%8A%A4%20%EC%A1%B4%20%EC%A0%9C%EB%A1%9C&hl=ko&gl=KR&ceid=KR:ko"
