spring:
  application:
    name: gamestock-backend
  datasource:
    url: jdbc:mysql://localhost:3306/gamestock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8081
  error:
    include-message: always
gamestock:
  cors-origin: ${GAMESTOCK_CORS_ORIGIN:http://localhost:8080}
  news:
    enabled: ${GAMESTOCK_NEWS_ENABLED:true}
    refresh-ms: ${GAMESTOCK_NEWS_REFRESH_MS:600000}
    initial-delay-ms: ${GAMESTOCK_NEWS_INITIAL_DELAY_MS:30000}
    feeds:
      - "NEXA|https://news.google.com/rss/search?q=%EA%B2%8C%EC%9E%84%20%EC%8B%A0%EC%9E%91&hl=ko&gl=KR&ceid=KR:ko"
      - "STAR|https://news.google.com/rss/search?q=%EC%95%A1%EC%85%98%20%EA%B2%8C%EC%9E%84&hl=ko&gl=KR&ceid=KR:ko"
      - "MOMO|https://news.google.com/rss/search?q=%EB%AA%A8%EB%B0%94%EC%9D%BC%20%EA%B2%8C%EC%9E%84&hl=ko&gl=KR&ceid=KR:ko"
      - "VOID|https://news.google.com/rss/search?q=%EC%8A%88%ED%8C%85%20%EA%B2%8C%EC%9E%84&hl=ko&gl=KR&ceid=KR:ko"
